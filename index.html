<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 증시 리포트</title>
<script src="reports.js"></script>
<script src="contents.js"></script>
<style>
:root{
  --primary:#0066cc;
  --primary-focus:#0071e3;
  --primary-on-dark:#2997ff;
  --ink:#1d1d1f;
  --ink-80:#333333;
  --ink-48:#7a7a7a;
  --body-muted:#cccccc;
  --canvas:#ffffff;
  --parchment:#f5f5f7;
  --pearl:#fafafc;
  --hairline:#e0e0e0;
  --divider-soft:#f0f0f0;
  --surface-black:#000000;
  --tile-1:#1d1d1f;
  --up:#ff3b30;
  --down:#0066cc;
  --flat:#86868b;
  --green:#34c759;
  --r-xs:5px; --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]){
    --primary:#2997ff;
    --primary-on-dark:#2997ff;
    --ink:#f5f5f7;
    --ink-80:#d2d2d7;
    --ink-48:#98989d;
    --body-muted:#98989d;
    --canvas:#1c1c1e;
    --parchment:#161618;
    --pearl:#232325;
    --hairline:#3a3a3c;
    --divider-soft:#2c2c2e;
    --down:#2997ff;
  }
}
:root[data-theme="dark"]{
  --primary:#2997ff;
  --primary-on-dark:#2997ff;
  --ink:#f5f5f7;
  --ink-80:#d2d2d7;
  --ink-48:#98989d;
  --body-muted:#98989d;
  --canvas:#1c1c1e;
  --parchment:#161618;
  --pearl:#232325;
  --hairline:#3a3a3c;
  --divider-soft:#2c2c2e;
  --down:#2997ff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: var(--parchment);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── Top tabs (global-nav) ── */
#top-tabs {
  display: flex;
  align-items: center;
  background: var(--surface-black);
  padding: 0 20px;
  height: 44px;
  flex: 0 0 auto;
}
.theme-toggle { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.theme-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: var(--r-pill);
  opacity: .45;
  transition: opacity .15s, background .15s;
  line-height: 1;
}
.theme-btn:hover { opacity: .8; }
.theme-btn.active { opacity: 1; background: rgba(255,255,255,.12); }
.theme-btn:active { transform: scale(.9); }
.top-tab {
  display: flex;
  align-items: center;
  padding: 0 18px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: -0.12px;
  color: rgba(255,255,255,.62);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .2s ease, border-color .2s ease;
  user-select: none;
}
.top-tab:hover { color: #fff; }
.top-tab.active { color: var(--primary-on-dark); border-bottom-color: var(--primary-on-dark); font-weight: 600; }
.top-tab:active { transform: scale(.97); }

#view-wrap { flex: 1; display: flex; min-height: 0; }
.view { display: flex; flex: 1; min-height: 0; }
.view.hidden { display: none; }

/* ── Side nav (shared: kospi 날짜 선택 / 콘텐츠 날짜 선택) ── */
.side-nav {
  width: 220px;
  min-width: 220px;
  background: var(--surface-black);
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.side-nav-title {
  padding: 22px 18px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-48);
  letter-spacing: -0.12px;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.date-list { flex: 1; padding: 10px; overflow-y: auto; }
.side-month-header {
  position: sticky;
  top: 0;
  background: var(--surface-black);
  padding: 14px 8px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-48);
  letter-spacing: -0.12px;
  z-index: 1;
}
.date-item {
  padding: 10px 14px;
  margin-bottom: 2px;
  font-size: 13px;
  color: rgba(255,255,255,.72);
  cursor: pointer;
  border-radius: var(--r-pill);
  transition: background .15s, color .15s;
  line-height: 1.4;
}
.date-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.date-item.active {
  background: rgba(41,151,255,.16);
  color: var(--primary-on-dark);
  font-weight: 600;
}
.date-item:active { transform: scale(.97); }
.date-item .di-date { font-size: 12px; color: inherit; }
.date-item.active .di-date { color: inherit; }

/* ── Main panel (shared) ── */
.main-panel {
  flex: 1;
  padding: 32px 40px;
  max-width: 1240px;
  margin: 0 auto;
  width: 100%;
  overflow-y: auto;
}

/* ── Report header ── */
.report-header {
  background: var(--tile-1);
  color: #fff;
  border-radius: var(--r-lg);
  padding: 28px 32px;
  margin-bottom: 24px;
}
.rh-badge {
  display: inline-block;
  background: var(--primary);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: var(--r-pill);
  letter-spacing: -0.12px;
  margin-bottom: 12px;
}
.rh-title { font-size: 26px; font-weight: 600; letter-spacing: -0.374px; margin-bottom: 8px; }
.rh-meta { font-size: 13px; color: var(--body-muted); letter-spacing: -0.224px; }

/* ── Section (alternating light/parchment tile rhythm) ── */
.section {
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 24px 28px;
  margin-bottom: 20px;
}
.section:nth-of-type(even) { background: var(--parchment); }
.section-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.374px;
  color: var(--ink);
  margin-bottom: 18px;
}

/* ── Market overview grid ── */
.market-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.market-card {
  background: var(--pearl);
  border: 1px solid var(--divider-soft);
  border-radius: var(--r-md);
  padding: 14px 16px;
}
.mc-label { font-size: 11px; color: var(--ink-48); font-weight: 600; margin-bottom: 4px; letter-spacing: -0.12px; }
.mc-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
.mc-value { font-size: 15px; font-weight: 400; color: var(--ink); letter-spacing: -0.224px; }
.mc-change { font-size: 12px; color: var(--ink-80); white-space: nowrap; }
.pos { color: var(--up); }
.neg { color: var(--down); }
.flat { color: var(--flat); }

/* ── Breadth bar ── */
.breadth-bar {
  display: flex;
  height: 5px;
  border-radius: var(--r-pill);
  overflow: hidden;
  margin-top: 8px;
}
.bb-rise { background: var(--up); }
.bb-fall { background: var(--down); }
.bb-flat { background: var(--hairline); }
.breadth-label { font-size: 11px; color: var(--ink-48); margin-top: 5px; }

/* ── Investor flow ── */
.investor-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.inv-chip {
  background: var(--pearl);
  border: 1px solid var(--divider-soft);
  border-radius: var(--r-pill);
  padding: 5px 14px;
  font-size: 12px;
  color: var(--ink-80);
}
.inv-chip span { font-weight: 400; }
.inv-chip span.pos { color: var(--up); }
.inv-chip span.neg { color: var(--down); }

/* ── Stock cards: 좌 코스피 / 우 코스닥 2열 ── */
.markets-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.markets-columns .section { margin-bottom: 0; }
@media (max-width: 900px) {
  .markets-columns { grid-template-columns: 1fr; }
}
.stock-list { display: flex; flex-direction: column; gap: 14px; }
.stock-card {
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.sc-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  background: var(--pearl);
  border-bottom: 1px solid var(--hairline);
  flex-wrap: wrap;
}
.sc-rank {
  font-size: 17px;
  min-width: 26px;
}
.sc-name {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.224px;
  color: var(--ink);
  text-decoration: none;
}
.sc-name:hover { color: var(--primary); text-decoration: underline; }
.sc-vol { font-size: 12px; color: var(--ink-48); margin-left: auto; white-space: nowrap; }
.badge {
  font-size: 10px;
  font-weight: 400;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}
.badge-high { background: rgba(255,59,48,.1); color: var(--up); }
.badge-low  { background: rgba(0,102,204,.1); color: var(--down); }
.badge-cons { background: rgba(52,199,89,.14); color: var(--green); }

.sc-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }

.sc-price {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.price-arrow { font-size: 15px; }
.price-str { font-size: 15px; font-weight: 400; letter-spacing: -0.224px; }
.price-change { font-size: 13px; font-weight: 400; }

.sc-metrics {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-80);
}
.metric-tag {
  background: var(--pearl);
  border: 1px solid var(--divider-soft);
  border-radius: var(--r-sm);
  padding: 4px 10px;
}
.metric-tag b { color: var(--ink); font-weight: 400; }

.sc-summary {
  font-size: 13px;
  color: var(--ink-80);
  line-height: 1.6;
  padding: 12px 14px;
  background: var(--parchment);
  border-radius: var(--r-md);
}

.sc-sentiment {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-80);
  flex-wrap: wrap;
}
.sent-badge {
  font-size: 11px;
  font-weight: 400;
  padding: 3px 11px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}
.sent-pos { background: rgba(255,59,48,.1); color: var(--up); }
.sent-neg { background: rgba(0,102,204,.1); color: var(--down); }
.sent-neu { background: var(--divider-soft); color: var(--ink-48); }

.sc-insight {
  font-size: 12.5px;
  color: var(--ink-80);
  line-height: 1.7;
  border-top: 1px solid var(--divider-soft);
  padding-top: 12px;
}
.sc-insight .insight-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-48);
  letter-spacing: -0.12px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.sc-keypoint {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.224px;
  color: var(--ink);
  background: rgba(0,102,204,.06);
  border-radius: var(--r-md);
  padding: 10px 14px;
  line-height: 1.6;
}

.sector-analysis-text {
  font-size: 13px;
  color: var(--ink-80);
  line-height: 1.75;
  border-top: 1px solid var(--hairline);
  padding-top: 18px;
  white-space: pre-wrap;
}

/* ── Weekly divider ── */
.weekly-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 36px 0 20px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.224px;
  color: var(--ink);
}
.weekly-divider::before, .weekly-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--hairline);
}

/* ── Diverging bar chart ── */
.sector-bar-chart { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.sector-bar-row { display: flex; align-items: center; gap: 8px; min-height: 20px; }
.sector-bar-name {
  width: 140px;
  font-size: 11.5px;
  color: var(--ink-80);
  text-align: right;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.db-track {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  height: 14px;
}
.db-half-l {
  display: flex;
  justify-content: flex-end;
  align-items: stretch;
  background: var(--pearl);
}
.db-half-r {
  display: flex;
  justify-content: flex-start;
  align-items: stretch;
  background: var(--pearl);
}
.db-divider { background: var(--hairline); }
.db-bar { display: block; border-radius: 2px; }
.sector-bar-rate {
  width: 56px;
  font-size: 11.5px;
  font-weight: 400;
  flex-shrink: 0;
}

/* ── Content summary feed ── */
.content-date-header {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.224px;
  color: var(--ink);
  margin: 32px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--hairline);
}
.content-date-header:first-child { margin-top: 0; }
.content-run-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-48);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.content-run-count {
  background: rgba(0,102,204,.1);
  color: var(--primary);
  font-size: 11px;
  font-weight: 400;
  padding: 2px 9px;
  border-radius: var(--r-pill);
}
.content-card {
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  margin-bottom: 12px;
}
.cc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.cc-type { font-size: 15px; }
.cc-source {
  font-size: 11px;
  font-weight: 400;
  color: var(--primary);
  background: rgba(0,102,204,.1);
  padding: 3px 10px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}
.cc-title { font-size: 14.5px; font-weight: 400; letter-spacing: -0.224px; color: var(--ink); text-decoration: none; }
.cc-title:hover { color: var(--primary); text-decoration: underline; }
.cc-summary {
  font-size: 13px;
  color: var(--ink-80);
  line-height: 1.7;
  white-space: pre-wrap;
}
.cc-summary b { color: var(--ink); }
.cc-summary a { color: var(--primary); }

/* ── Empty state ── */
.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: var(--ink-48);
  font-size: 15px;
}

/* ── Responsive ── */
@media (max-width: 700px) {
  #view-wrap { flex-direction: column; }
  .view { flex-direction: column; }
  .side-nav { width: 100%; min-width: 0; height: auto; }
  .date-list { display: flex; overflow-x: auto; padding: 8px; }
  .side-month-header { display: none; }
  .date-item { white-space: nowrap; border-radius: var(--r-pill); }
  .main-panel { padding: 20px; }
}
</style>
</head>
<body>

<div id="top-tabs">
  <div class="top-tab active" data-view="kospi">📊 한국 증시 리포트</div>
  <div class="top-tab" data-view="content">📰 콘텐츠 요약</div>
  <div class="theme-toggle" id="theme-toggle">
    <button type="button" class="theme-btn" data-theme-choice="light" aria-label="라이트 모드">☀️</button>
    <button type="button" class="theme-btn" data-theme-choice="dark" aria-label="다크 모드">🌙</button>
  </div>
</div>

<div id="view-wrap">
  <div id="kospi-view" class="view">
    <nav class="side-nav">
      <div class="side-nav-title">📅 날짜 선택</div>
      <div id="date-list" class="date-list"></div>
    </nav>
    <div class="main-panel">
      <div id="report-root"></div>
      <div id="empty" class="empty-state" style="display:none">데이터가 없습니다.</div>
    </div>
  </div>

  <div id="content-view" class="view hidden">
    <nav class="side-nav">
      <div class="side-nav-title">📅 날짜 선택</div>
      <div id="content-date-list" class="date-list"></div>
    </nav>
    <div class="main-panel">
      <div id="content-root"></div>
      <div id="content-empty" class="empty-state" style="display:none">아직 요약이 없습니다.</div>
    </div>
  </div>
</div>

<script>
const RANK_EMOJI = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
const SENTIMENT  = {'긍정':'pos','부정':'neg','중립':'neu'};
const SENT_LABEL = {'긍정':'😊 긍정','부정':'😟 부정','중립':'😐 중립'};

function fmtDate(d) {
  // "20260724" → "2026.07.24 (목)"
  if (!d || d.length < 8) return d;
  const y = d.slice(0,4), m = d.slice(4,6), day = d.slice(6,8);
  const dow = ['일','월','화','수','목','금','토'][new Date(`${y}-${m}-${day}`).getDay()];
  return `${y}.${m}.${day} (${dow})`;
}

function sign(v) { return v >= 0 ? '+' : ''; }
function cls(v)  { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'flat'; }

function netStr(v) {
  const s = v >= 0 ? '+' : '';
  return `${s}${Math.round(v).toLocaleString()}억`;
}

function priceStr(prev, close, rate) {
  const arrow = rate >= 0 ? '📈' : '📉';
  const ch = `<span class="price-change ${cls(rate)}">${sign(rate)}${rate.toFixed(2)}%</span>`;
  if (prev && close) {
    return `<span class="price-arrow">${arrow}</span>
            <span class="price-str">${prev.toLocaleString()}원 → ${close.toLocaleString()}원</span> ${ch}`;
  }
  return `<span class="price-arrow">${arrow}</span>
          <span class="price-str">${(close||0).toLocaleString()}원</span> ${ch}`;
}

function pctChg(rate) {
  return `<span class="${cls(rate)}">${sign(rate)}${rate.toFixed(2)}%</span>`;
}

function renderMarketCard(label, valueHtml, changeHtml, breadth) {
  return `<div class="market-card">
    <div class="mc-label">${label}</div>
    <div class="mc-row">
      <span class="mc-value">${valueHtml}</span>
      ${changeHtml ? `<span class="mc-change">${changeHtml}</span>` : ''}
    </div>
    ${breadth || ''}
  </div>`;
}

function breadthBar(rise, fall, flat, total) {
  if (!total) return '';
  const rp = (rise/total*100).toFixed(1);
  const fp = (fall/total*100).toFixed(1);
  return `<div class="breadth-bar">
    <div class="bb-rise" style="width:${rp}%"></div>
    <div class="bb-fall" style="width:${fp}%"></div>
    <div class="bb-flat" style="flex:1"></div>
  </div>
  <div class="breadth-label">상승 ${rise} / 하락 ${fall} / 보합 ${flat}</div>
  <div class="breadth-label">상승비 ${rp}%</div>`;
}

function renderOverview(ov) {
  const kpCr = ov.kospi_change_rate || 0;
  const kqCr = ov.kosdaq_change_rate || 0;
  const cards = [
    renderMarketCard('KOSPI',
      `${ov.kospi_prev_close ? ov.kospi_prev_close.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}<span class="${cls(kpCr)}">${(ov.kospi_close||0).toLocaleString(undefined,{minimumFractionDigits:2})}</span>`,
      pctChg(kpCr),
      breadthBar(ov.kospi_rise||0, ov.kospi_fall||0, ov.kospi_flat||0, ov.kospi_total||0)
    ),
    renderMarketCard('KOSDAQ',
      `${ov.kosdaq_prev_close ? ov.kosdaq_prev_close.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}<span class="${cls(kqCr)}">${(ov.kosdaq_close||0).toLocaleString(undefined,{minimumFractionDigits:2})}</span>`,
      pctChg(kqCr),
      breadthBar(ov.kosdaq_rise||0, ov.kosdaq_fall||0, ov.kosdaq_flat||0, ov.kosdaq_total||0)
    ),
    renderMarketCard('나스닥',
      `${ov.nasdaq_prev ? ov.nasdaq_prev.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}<span class="${cls(ov.nasdaq_cr||0)}">${(ov.nasdaq_close||0).toLocaleString(undefined,{minimumFractionDigits:2})}</span>`,
      pctChg(ov.nasdaq_cr||0)),
    renderMarketCard('S&P 500',
      `${ov.sp500_prev ? ov.sp500_prev.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}<span class="${cls(ov.sp500_cr||0)}">${(ov.sp500_close||0).toLocaleString(undefined,{minimumFractionDigits:2})}</span>`,
      pctChg(ov.sp500_cr||0)),
    renderMarketCard('다우존스',
      `${ov.dow_prev ? ov.dow_prev.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}<span class="${cls(ov.dow_cr||0)}">${(ov.dow_close||0).toLocaleString(undefined,{minimumFractionDigits:2})}</span>`,
      pctChg(ov.dow_cr||0)),
    renderMarketCard('VIX',
      `${ov.vix_prev ? ov.vix_prev.toFixed(2)+' → ' : ''}<span class="${cls(-(ov.vix_cr||0))}">${(ov.vix||0).toFixed(2)}</span>`,
      ov.vix_prev ? `<span class="${cls(ov.vix_cr||0)}">${sign(ov.vix_cr||0)}${(ov.vix_cr||0).toFixed(2)}%</span>` : ''),
    renderMarketCard('미국 10년물',
      `${ov.us10y_prev ? ov.us10y_prev.toFixed(2)+'% → ' : ''}${(ov.us10y||0).toFixed(2)}%`,
      ov.us10y_prev ? (() => { const ch = ((ov.us10y||0)-(ov.us10y_prev||0)); return `<span class="${cls(ch)}">${sign(ch)}${ch.toFixed(3)}%p</span>`; })() : ''),
    renderMarketCard('원/달러',
      `${ov.usdkrw_prev ? ov.usdkrw_prev.toFixed(2)+' → ' : ''}<span class="${cls(ov.usdkrw_change||0)}">${(ov.usdkrw||0).toLocaleString(undefined,{minimumFractionDigits:2})}원</span>`,
      ov.usdkrw_prev ? `<span class="${cls(ov.usdkrw_change||0)}">${sign(ov.usdkrw_change||0)}${(ov.usdkrw_change||0).toFixed(2)}원</span>` : ''),
    renderMarketCard('WTI 유가',
      `${ov.wti_prev ? ov.wti_prev.toFixed(2)+' → ' : ''}<span class="${cls(ov.wti_change_rate||0)}">${(ov.wti_close||0).toFixed(2)}</span>`,
      pctChg(ov.wti_change_rate||0)),
    (() => {
      const dep = ov.deposit || 0;
      const chg = ov.deposit_chg || 0;
      const depStr = dep ? `${(dep/10000).toFixed(1)}조원` : '—';
      const chgSign = chg > 0 ? '+' : chg < 0 ? '-' : '';
      const chgStr = chg ? `<span class="${cls(chg)}">${chgSign}${Math.abs(chg).toLocaleString()}억</span>` : '';
      return renderMarketCard('고객예탁금', depStr, chgStr);
    })(),
  ];

  const fNet = ov.foreign_net || 0, iNet = ov.inst_net || 0, pNet = ov.indiv_net || 0;
  const invRow = `<div class="investor-row">
    <div class="inv-chip">외국인 <span class="${cls(fNet)}">${netStr(fNet)}</span></div>
    <div class="inv-chip">기관 <span class="${cls(iNet)}">${netStr(iNet)}</span></div>
    <div class="inv-chip">개인 <span class="${cls(pNet)}">${netStr(pNet)}</span></div>
  </div>`;

  return `<div class="section">
    <div class="section-title">📈 시장 개요</div>
    <div class="market-grid">${cards.join('')}</div>
    ${invRow}
  </div>`;
}

function renderStock(s, idx, consecutiveMap) {
  const amount = (s.amount / 1e8).toLocaleString(undefined, {maximumFractionDigits:0});
  const prev   = s.prev_close || 0;
  const close  = s.close      || 0;
  const rate   = (prev && close) ? ((close-prev)/prev*100) : (s.change_rate || 0);
  const ticker = s.ticker || '';

  const nameHtml = ticker
    ? `<a class="sc-name" href="https://www.valley.town/financials/quote/${ticker}:KRX/summary" target="_blank">${s.name}</a>`
    : `<span class="sc-name">${s.name}</span>`;

  const cap = s.market_cap ? `${s.market_cap.toLocaleString()}억` : '-';
  const per = s.per ? `${s.per}` : '-';
  const eps = s.eps ? `${s.eps.toLocaleString()}원` : '-';
  const fNet = s.foreign_net || 0, iNet = s.inst_net || 0, pNet = s.indiv_net || 0;

  const sentiment  = s.sentiment || '중립';
  const sentCls    = SENTIMENT[sentiment] || 'neu';
  const sentLabel  = SENT_LABEL[sentiment] || '😐 중립';

  const insightHtml = s.insight
    ? `<div class="sc-insight"><div class="insight-label">📊 3축 분석</div>${escHtml(s.insight).replace(/\s*\|\s*(?=[①②③])/g, '<br>')}</div>` : '';
  const keyHtml = s.key_point
    ? `<div class="sc-keypoint">💡 ${escHtml(s.key_point)}</div>` : '';

  return `<div class="stock-card">
    <div class="sc-header">
      <span class="sc-rank">${RANK_EMOJI[idx] || (idx+1)+'.'}</span>
      ${nameHtml}
      <span class="sc-vol">거래대금 ${amount}억</span>
    </div>
    <div class="sc-body">
      <div class="sc-price">${priceStr(prev, close, rate)}</div>
      <div class="sc-metrics">
        <span class="metric-tag">시총 <b>${cap}</b></span>
        <span class="metric-tag">PER <b>${per}</b></span>
        <span class="metric-tag">EPS <b>${eps}</b></span>
        <span class="metric-tag">외국인 <b class="${cls(fNet)}">${netStr(fNet)}</b></span>
        <span class="metric-tag">기관 <b class="${cls(iNet)}">${netStr(iNet)}</b></span>
        <span class="metric-tag">개인 <b class="${cls(pNet)}">${netStr(pNet)}</b></span>
      </div>
      ${s.summary ? `<div class="sc-summary">📝 ${escHtml(s.summary)}</div>` : ''}
      <div class="sc-sentiment">
        <span class="sent-badge sent-${sentCls}">${sentLabel}</span>
        <span>${escHtml(s.cause || '')}</span>
      </div>
      ${insightHtml}
      ${keyHtml}
    </div>
  </div>`;
}

function renderSector(sectorPerf, sectorAnalysis) {
  const bullish = sectorPerf.filter(s => s.rate > 0).sort((a,b) => b.rate - a.rate).slice(0,10);
  const bearish  = sectorPerf.filter(s => s.rate < 0).sort((a,b) => a.rate - b.rate).slice(0,10);

  const chartSectors = [...bullish, ...bearish].sort((a,b) => b.rate - a.rate);
  const chartHtml = chartSectors.length ? renderDivergingChart(chartSectors) : '';

  const analysisHtml = sectorAnalysis
    ? `<div class="sector-analysis-text">${escHtml(sectorAnalysis)}</div>` : '';

  if (!chartHtml && !analysisHtml) return '';

  return `<div class="section">
    <div class="section-title">🔄 섹터 순환매 분석</div>
    ${chartHtml}
    ${analysisHtml}
  </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Weekly view helpers ──
function isFriday(dateStr) {
  const y = +dateStr.slice(0,4), m = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  return new Date(y, m, d).getDay() === 5;
}

function findPrevFriday(dateStr) {
  const sorted = Object.keys(REPORTS).sort();
  const idx = sorted.indexOf(dateStr);
  for (let i = idx - 1; i >= 0; i--) {
    if (isFriday(sorted[i])) return sorted[i];
  }
  return null;
}

function getWeekDates(fridayDateStr) {
  const fy = +fridayDateStr.slice(0,4), fm = +fridayDateStr.slice(4,6)-1, fd = +fridayDateStr.slice(6,8);
  const friMs = new Date(fy, fm, fd).getTime();
  const monMs = friMs - 4 * 86400000;
  return Object.keys(REPORTS).sort().filter(ds => {
    const dy = +ds.slice(0,4), dm = +ds.slice(4,6)-1, dd = +ds.slice(6,8);
    const ms = new Date(dy, dm, dd).getTime();
    return ms >= monMs && ms <= friMs;
  });
}

function computeWeeklySectorPerf(weekDates) {
  const map = {};
  for (const ds of weekDates) {
    const sp = (REPORTS[ds] && REPORTS[ds].sector_perf) || [];
    for (const s of sp) {
      if (!map[s.no]) map[s.no] = { name: s.name, cum: 1 };
      map[s.no].cum *= (1 + s.rate / 100);
    }
  }
  return Object.values(map)
    .map(s => ({ name: s.name, rate: (s.cum - 1) * 100 }))
    .sort((a, b) => b.rate - a.rate);
}

function renderDivergingChart(sectors) {
  if (!sectors.length) return '';
  const maxAbs = Math.max(...sectors.map(s => Math.abs(s.rate)), 0.01);
  const rows = sectors.map(s => {
    const pct = (Math.abs(s.rate) / maxAbs * 100).toFixed(1);
    const isPos = s.rate >= 0;
    const leftBar  = isPos ? '' : `<div class="db-bar" style="width:${pct}%;background:var(--down)"></div>`;
    const rightBar = isPos ? `<div class="db-bar" style="width:${pct}%;background:var(--up)"></div>` : '';
    return `<div class="sector-bar-row">
      <div class="sector-bar-name">${escHtml(s.name)}</div>
      <div class="db-track">
        <div class="db-half-l">${leftBar}</div>
        <div class="db-divider"></div>
        <div class="db-half-r">${rightBar}</div>
      </div>
      <div class="sector-bar-rate ${cls(s.rate)}">${sign(s.rate)}${s.rate.toFixed(1)}%</div>
    </div>`;
  }).join('');
  return `<div class="sector-bar-chart">${rows}</div>`;
}

function renderWeeklySection(currentDateStr, prevFriDateStr, weekDates) {
  const currOv = (REPORTS[currentDateStr] && REPORTS[currentDateStr].market_overview) || {};
  const prevOv = prevFriDateStr ? ((REPORTS[prevFriDateStr] && REPORTS[prevFriDateStr].market_overview) || {}) : {};

  const pct2dp = (c, p) => {
    const d = (c - p) / Math.abs(p) * 100;
    return `${p.toLocaleString(undefined,{minimumFractionDigits:2})} → ${c.toLocaleString(undefined,{minimumFractionDigits:2})} <span class="${cls(d)}">${sign(d)}${d.toFixed(2)}%</span>`;
  };
  const absDiff = (c, p) => {
    const d = c - p;
    return `${p.toFixed(2)}% → ${c.toFixed(2)}% <span class="${cls(d)}">${sign(d)}${d.toFixed(3)}%p</span>`;
  };
  const usdDiff = (c, p) => {
    const d = c - p;
    return `${p.toFixed(2)} → ${c.toFixed(2)}원 <span class="${cls(-d)}">${sign(d)}${d.toFixed(2)}원</span>`;
  };
  const vixDiff = (c, p) => {
    const d = c - p;
    return `${p.toFixed(2)} → ${c.toFixed(2)} <span class="${cls(-d)}">${sign(d)}${d.toFixed(2)}</span>`;
  };
  const depDiff = (c, p) => {
    const d = c - p;
    return `${(p/10000).toFixed(1)}조 → ${(c/10000).toFixed(1)}조 <span class="${cls(d)}">${sign(d)}${(Math.abs(d)/10000).toFixed(1)}조</span>`;
  };

  const mkCard = (label, curr, prev, fmtVal, fmtChg) => {
    if (!curr) return '';
    const val = fmtVal(curr);
    const hasPrev = prev != null && prev !== 0;
    const chgHtml = hasPrev ? fmtChg(curr, prev) : '';
    const colorCls = (hasPrev && chgHtml) ? cls(curr - prev) : '';
    return renderMarketCard(label, `<span class="${colorCls}">${val}</span>`, chgHtml);
  };

  const cards = [
    mkCard('KOSPI 주간',    currOv.kospi_close,  prevOv.kospi_close,  v => v.toLocaleString(undefined,{minimumFractionDigits:2}), pct2dp),
    mkCard('KOSDAQ 주간',   currOv.kosdaq_close, prevOv.kosdaq_close, v => v.toLocaleString(undefined,{minimumFractionDigits:2}), pct2dp),
    mkCard('나스닥 주간',   currOv.nasdaq_close, prevOv.nasdaq_close, v => v.toLocaleString(undefined,{minimumFractionDigits:2}), pct2dp),
    mkCard('S&P500 주간',   currOv.sp500_close,  prevOv.sp500_close,  v => v.toLocaleString(undefined,{minimumFractionDigits:2}), pct2dp),
    mkCard('VIX 주간',      currOv.vix,          prevOv.vix,          v => v.toFixed(2), vixDiff),
    mkCard('원/달러 주간',  currOv.usdkrw,       prevOv.usdkrw,       v => `${v.toFixed(2)}원`, usdDiff),
    mkCard('WTI 주간',      currOv.wti_close,    prevOv.wti_close,    v => `$${v.toFixed(2)}`, pct2dp),
    mkCard('미국10년물 주간', currOv.us10y,       prevOv.us10y,        v => `${v.toFixed(2)}%`, absDiff),
    currOv.deposit ? mkCard('예탁금 주간', currOv.deposit, prevOv.deposit, v => `${(v/10000).toFixed(1)}조`, depDiff) : '',
  ].filter(Boolean).join('');

  // Weekly investor flow sum
  let wF = 0, wI = 0, wP = 0;
  for (const ds of weekDates) {
    const ov = (REPORTS[ds] && REPORTS[ds].market_overview) || {};
    wF += ov.foreign_net || 0;
    wI += ov.inst_net    || 0;
    wP += ov.indiv_net   || 0;
  }
  const invRow = `<div class="investor-row">
    <div class="inv-chip">외국인 주간 <span class="${cls(wF)}">${netStr(wF)}</span></div>
    <div class="inv-chip">기관 주간 <span class="${cls(wI)}">${netStr(wI)}</span></div>
    <div class="inv-chip">개인 주간 <span class="${cls(wP)}">${netStr(wP)}</span></div>
  </div>`;

  const chartHtml = renderDivergingChart(computeWeeklySectorPerf(weekDates));
  const weekLabel = prevFriDateStr ? `vs ${fmtDate(prevFriDateStr)} 기준` : `${weekDates.length}일 누적`;

  return `
    <div class="weekly-divider"><span>📆 주간 변동 (${weekLabel})</span></div>
    <div class="section">
      <div class="section-title">📊 시장 주간 변동</div>
      <div class="market-grid">${cards}</div>
      ${invRow}
    </div>
    <div class="section">
      <div class="section-title">🔄 섹터 주간 등락</div>
      ${chartHtml}
    </div>`;
}

function renderReport(data) {
  const ov   = data.market_overview || {};
  const kpCr = ov.kospi_change_rate || 0;
  const kqCr = ov.kosdaq_change_rate || 0;
  const mEmoji = kpCr >= 0 ? '🐂' : '🐻';
  const formatted = fmtDate(data.date);
  const tokStr = data.total_tokens >= 1000 ? `${Math.floor(data.total_tokens/1000)}k` : String(data.total_tokens||0);
  const consMap = data.consecutive_map || {};

  const kpSign = kpCr >= 0 ? '+' : '';
  const kqSign = kqCr >= 0 ? '+' : '';
  const badgeTxt = kpCr >= 0 ? '강세 마감' : '약세 마감';

  let html = `
    <div class="report-header">
      <div class="rh-badge">${mEmoji} ${badgeTxt}</div>
      <div class="rh-title">${formatted} 한국 증시 리포트</div>
      <div class="rh-meta">KOSPI ${ov.kospi_prev_close ? ov.kospi_prev_close.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}${(ov.kospi_close||0).toLocaleString(undefined,{minimumFractionDigits:2})} (${kpSign}${kpCr.toFixed(2)}%)&nbsp;&nbsp;|&nbsp;&nbsp;KOSDAQ ${ov.kosdaq_prev_close ? ov.kosdaq_prev_close.toLocaleString(undefined,{minimumFractionDigits:2})+' → ' : ''}${(ov.kosdaq_close||0).toLocaleString(undefined,{minimumFractionDigits:2})} (${kqSign}${kqCr.toFixed(2)}%)&nbsp;&nbsp;토큰 ${tokStr}</div>
    </div>
    ${renderOverview(ov)}`;

  const kospiCards  = (data.stocks || []).map((s,i) => renderStock(s, i, consMap)).join('');
  const kosdaqCards = (data.kosdaq_stocks || []).map((s,i) => renderStock(s, i, consMap)).join('');
  if (kospiCards || kosdaqCards) {
    html += `<div class="markets-columns">
      <div class="section">
        <div class="section-title">📊 코스피 거래대금 TOP 10</div>
        <div class="stock-list">${kospiCards || '<div style="color:var(--ink-48);font-size:13px">데이터 없음</div>'}</div>
      </div>
      <div class="section">
        <div class="section-title">📊 코스닥 거래대금 TOP 10</div>
        <div class="stock-list">${kosdaqCards || '<div style="color:var(--ink-48);font-size:13px">데이터 없음</div>'}</div>
      </div>
    </div>`;
  }

  html += renderSector(data.sector_perf || [], data.sector_analysis || '');

  if (isFriday(data.date)) {
    const prevFri   = findPrevFriday(data.date);
    const weekDates = getWeekDates(data.date);
    html += renderWeeklySection(data.date, prevFri, weekDates);
  }

  return html;
}

function monthHeaderLabel(d) {
  return `${d.slice(0,4)}년 ${parseInt(d.slice(4,6),10)}월`;
}

function updateUrlDate(d) {
  const params = new URLSearchParams(location.search);
  params.set('date', d);
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
}

function buildSidebar(dates, activeDate) {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  const active = activeDate && dates.includes(activeDate) ? activeDate : dates[0];
  let lastMonth = null;
  dates.forEach((d) => {
    const month = d.slice(0,6);
    if (month !== lastMonth) {
      const mh = document.createElement('div');
      mh.className = 'side-month-header';
      mh.textContent = monthHeaderLabel(d);
      list.appendChild(mh);
      lastMonth = month;
    }
    const div = document.createElement('div');
    div.className = 'date-item' + (d === active ? ' active' : '');
    div.dataset.date = d;
    const weekTag = isFriday(d) ? `<span style="font-size:10px;color:var(--primary-on-dark);margin-top:2px;display:block">📆 주간포함</span>` : '';
    div.innerHTML = `<div>${fmtDate(d)}${weekTag}</div>`;
    div.addEventListener('click', () => {
      document.querySelectorAll('#date-list .date-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      showReport(d);
      updateUrlDate(d);
    });
    list.appendChild(div);
  });
}

function showReport(dateStr) {
  const root  = document.getElementById('report-root');
  const empty = document.getElementById('empty');
  const data  = (typeof REPORTS !== 'undefined') && REPORTS[dateStr];
  if (!data) {
    root.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  root.innerHTML = renderReport(data);
}

// ── Content summary (콘텐츠 요약 탭) ──
const TYPE_EMOJI = { blog: '📝', youtube: '🎬' };

function sanitizeSummary(raw) {
  // 허용 태그(b, i, a href)만 되살리고 나머지는 전부 이스케이프 — XSS 방지
  let s = escHtml(raw || '');
  s = s.replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
  s = s.replace(/&lt;i&gt;/g, '<i>').replace(/&lt;\/i&gt;/g, '</i>');
  s = s.replace(/&lt;a href=(?:&quot;|&#39;)([^"'<>]*?)(?:&quot;|&#39;)&gt;/g, '<a href="$1" target="_blank" rel="noopener">');
  s = s.replace(/&lt;\/a&gt;/g, '</a>');
  return s;
}

function renderContentCard(item) {
  const emoji = TYPE_EMOJI[item.type] || '📄';
  return `<div class="content-card">
    <div class="cc-header">
      <span class="cc-type">${emoji}</span>
      <span class="cc-source">${escHtml(item.name)}</span>
      <a class="cc-title" href="${escHtml(item.url)}" target="_blank" rel="noopener">${escHtml(item.title)}</a>
    </div>
    <div class="cc-summary">${sanitizeSummary(item.summary)}</div>
  </div>`;
}

function renderContentFeed() {
  if (typeof CONTENTS === 'undefined' || !Object.keys(CONTENTS).length) return '';
  const runIds = Object.keys(CONTENTS).sort().reverse();
  let html = '';
  let lastDate = null;
  for (const rid of runIds) {
    const run = CONTENTS[rid];
    if (!run.items || !run.items.length) continue;
    if (run.date !== lastDate) {
      html += `<div class="content-date-header" data-date="${run.date}">${fmtDate(run.date)}</div>`;
      lastDate = run.date;
    }
    html += `<div class="content-run-header">🕐 ${run.time} <span class="content-run-count">${run.items.length}건</span></div>`;
    html += run.items.map(renderContentCard).join('');
  }
  return html;
}

function buildContentSidebar() {
  const list = document.getElementById('content-date-list');
  list.innerHTML = '';
  if (typeof CONTENTS === 'undefined') return;
  const dates = [...new Set(Object.values(CONTENTS).map(r => r.date))].sort().reverse();
  let lastMonth = null;
  dates.forEach((d, i) => {
    const month = d.slice(0,6);
    if (month !== lastMonth) {
      const mh = document.createElement('div');
      mh.className = 'side-month-header';
      mh.textContent = monthHeaderLabel(d);
      list.appendChild(mh);
      lastMonth = month;
    }
    const div = document.createElement('div');
    div.className = 'date-item' + (i === 0 ? ' active' : '');
    div.innerHTML = `<div>${fmtDate(d)}</div>`;
    div.addEventListener('click', () => {
      document.querySelectorAll('#content-date-list .date-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      const target = document.querySelector(`.content-date-header[data-date="${d}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    list.appendChild(div);
  });
}

function initContentView() {
  const root  = document.getElementById('content-root');
  const empty = document.getElementById('content-empty');
  const html  = renderContentFeed();
  if (html) {
    root.innerHTML = html;
    empty.style.display = 'none';
    buildContentSidebar();
  } else {
    root.innerHTML = '';
    empty.style.display = 'flex';
  }
}

// ── Tab switching ──
function switchView(view) {
  document.querySelectorAll('.top-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.getElementById('kospi-view').classList.toggle('hidden', view !== 'kospi');
  document.getElementById('content-view').classList.toggle('hidden', view !== 'content');
}

document.querySelectorAll('.top-tab').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
});

// ── Theme toggle (라이트/다크) ──
function systemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme) {
  if (theme === 'dark' || theme === 'light') {
    document.documentElement.setAttribute('data-theme', theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  const effective = theme || systemTheme();
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.themeChoice === effective);
  });
}
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const choice = btn.dataset.themeChoice;
    localStorage.setItem('theme', choice);
    applyTheme(choice);
  });
});
applyTheme(localStorage.getItem('theme'));

// ── Init ──
(function init() {
  const params = new URLSearchParams(location.search);
  const requestedDate = params.get('date');

  if (typeof REPORTS === 'undefined' || !Object.keys(REPORTS).length) {
    document.getElementById('empty').style.display = 'flex';
  } else {
    const dates = Object.keys(REPORTS).sort().reverse();
    const initialDate = requestedDate && dates.includes(requestedDate) ? requestedDate : dates[0];
    buildSidebar(dates, initialDate);
    showReport(initialDate);
  }

  initContentView();

  if (params.get('tab') === 'content') switchView('content');
})();
</script>
